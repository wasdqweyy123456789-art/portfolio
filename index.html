<!DOCTYPE html>

<!-- ===== CSS：決定「長什麼樣」 ===== -->

  h1 { color: black; }
</style>
</head>

<!-- 實驗：刪掉後面的 </p>，看畫面有沒有壞 -->

<!-- ===== JavaScript：決定「按下去會怎樣」 ===== -->
